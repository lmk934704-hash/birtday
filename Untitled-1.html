<!DOCTYPE html>
<html>

<head>

<title> 💋birthday of ekram 🎀</title>

<style>

body {
    margin: 0;
    min-height: 100vh;

    background-image: url("");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial;
}


/* الظرف */

.envelope {
    width: 150px;
    height: 105px;

    background: #f47fa9;

    position: relative;

    border-radius: 8px;

    cursor: pointer;

    box-shadow: 0 8px 20px rgba(0,0,0,0.3);

    overflow: hidden;
}


/* غطاء الظرف */

.flap {
    position: absolute;

    width: 0;
    height: 0;

    border-left: 75px solid transparent;
    border-right: 75px solid transparent;
    border-top: 60px solid #ffb6d5;

    top: 0;
    left: 0;

    z-index: 3;

    transition: 0.7s;
}


/* الرسالة */

.letter {

    position: absolute;

    background: white;

    width: 125px;
    min-height: 110px;

    left: 12px;
    top: 15px;

    border-radius: 8px;

    padding: 10px;

    box-sizing: border-box;

    text-align: center;

    color: #d94f88;

    font-size: 15px;

    opacity: 0;

    transform: translateY(20px);

    transition: 0.7s;

    z-index: 1;
}


/* الفيديو مخفي في البداية */

.video {

    position: absolute;

    top: calc(50% + 130px);

    width: 85%;

    max-width: 400px;

    background: white;

    padding: 12px;

    border-radius: 20px;

    box-shadow: 0 8px 25px rgba(0,0,0,0.25);

    opacity: 0;

    transform: translateY(30px);

    pointer-events: none;

    transition: 0.8s;

}


/* الفيديو نفسه */

.video video {

    width: 100%;

    border-radius: 14px;

    display: block;

}


/* بعد فتح الظرف */

.open {
    overflow: visible;
}


.open .flap {

    transform: rotateX(180deg);

}


.open .letter {

    opacity: 1;

    transform: translateY(-125px);

    z-index: 5;

}


.open ~ .video {

    opacity: 1;

    transform: translateY(0);

    pointer-events: auto;

}


/* جملة اضغطي */

.hint {

    position: absolute;

    top: calc(50% + 90px);

    background: rgba(255,255,255,0.85);

    padding: 8px 15px;

    border-radius: 20px;

    color: #d94f88;

    font-size: 14px;

}

</style>

</head>


<body>


<!-- الظرف -->

<div class="envelope" onclick="openEnvelope()">

    <div class="letter">

        💌

        <br><br>

        <b>كل سنة وإنتِ طيبة يا حموكشه 💗</b>

        <br><br>

        وعقبال سنين كتير حلوة عليكي 🎀

    </div>

    <div class="flap"></div>

</div>


<!-- جملة اضغطي -->

<div class="hint">

    اضغطي على الظرف 💌

</div>


<!-- الفيديو -->

<div class="video">

    <h3 style="color:#d94f88; text-align:center;">
        🎬 فيديو مخصوص ليكي 💗
    </h3>

    <video controls playsinline>

        <source src="https://files.catbox.moe/biwhjd.mp4" type="video/mp4">

    </video>

</div>


<script>

function openEnvelope() {

    document
    .querySelector(".envelope")
    .classList.add("open");

    document
    .querySelector(".hint")
    .innerText = "💗 المفاجأة اتفتحت!";

}

</script>


</body>

</html>
